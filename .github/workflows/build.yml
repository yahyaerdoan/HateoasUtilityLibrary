name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore HateoasUtilityLibrary.slnx

      - name: Build
        run: dotnet build HateoasUtilityLibrary.slnx --no-restore --configuration Release

      - name: Test
        # Hateoas.Tests only targets net10.0 (src libraries are multi-targeted net8/9/10, tests aren't) - single run, no -f loop needed.
        # --report-trx is the MTP-native flag (global.json opts dotnet test into MTP mode); needs Microsoft.Testing.Extensions.TrxReport referenced by the test project.
        run: dotnet test --project test/Hateoas.Tests/Hateoas.Tests.csproj --no-build --configuration Release --report-trx --report-trx-filename test-results.net10.0.trx --results-directory test/Hateoas.Tests/TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test/Hateoas.Tests/TestResults/*.trx
